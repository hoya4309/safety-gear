<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--sub:#6b7280;--line:#e4e6eb;--acc:#f26b1d;--accb:#fff1e7;
--ok:#15803d;--okb:#e7f6ec;--warn:#b45309;--warnb:#fff5dc;--bad:#c62828;--badb:#fdeaea;--blue:#1d4ed8;--blueb:#e6edff;--gray:#4b5563;--grayb:#eef0f3}
*{box-sizing:border-box}
body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px}
button:hover{border-color:#c9ccd3}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.dark{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
button.danger{color:var(--bad)}
button.ghost{background:transparent;border-color:transparent;color:var(--sub)}
button.sm{padding:4px 10px;font-size:13px}
button.lg{padding:12px 18px;font-size:16px}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}
input.num{width:80px;text-align:right}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px;font-weight:600}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.top .brand{font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.top .who{margin-left:auto;font-size:13.5px;opacity:.92;text-align:right;line-height:1.25}
.top .who small{display:block;opacity:.7;font-size:11.5px}
.top button{background:transparent;color:#fff;border-color:#ffffff40}
.live{font-size:11px;opacity:.75;white-space:nowrap}.live:before{content:'●';color:#4ade80;margin-right:3px}
.offline{background:var(--warnb);color:var(--warn);text-align:center;font-size:13px;padding:6px}
.tabs{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:52px;z-index:4}
.tabs button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:13px 12px;white-space:nowrap;color:var(--sub);background:none}

main{max-width:1200px;margin:0 auto;padding:20px 16px 90px}
main.narrow{max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card>h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .r{margin-left:auto;display:flex;gap:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{cursor:pointer;margin:0;transition:.15s}
.kpi:hover{border-color:var(--acc)}

.kpi.alert .v{color:var(--acc)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--sub);font-weight:600;font-size:12.5px;background:#fafbfc;white-space:nowrap}
td.r,th.r{text-align:right}
tr.grp td{background:#fafbfc;font-weight:700;font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.t-wait{background:var(--warnb);color:var(--warn)}.t-ok{background:var(--okb);color:var(--ok)}.t-bad{background:var(--badb);color:var(--bad)}
.t-blue{background:var(--blueb);color:var(--blue)}.t-gray{background:var(--grayb);color:var(--gray)}.t-acc{background:var(--accb);color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:22px;font-size:14px}
.modal{position:fixed;inset:0;background:#0b0f1a88;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.hidden{display:none!important}
.sheet{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.sheet h2{margin:0 0 4px;font-size:19px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:-22px;background:#fff;padding:12px 0 4px;border-top:1px solid var(--line);flex-wrap:wrap}
.sig{border:2px dashed #cfd3da;border-radius:10px;width:100%;height:170px;touch-action:none;background:#fcfcfd;display:block}

.chip:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}

details.cat{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
details.cat summary{padding:11px 14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px}
details.cat .in{padding:0 14px 14px}
.notice{background:var(--accb);border:1px solid #fbd2b6;border-radius:12px;padding:16px;margin-bottom:16px}
.notice h3{margin:0 0 10px;color:#9a3d06}
.pend{background:#fff;border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.guide{background:#f7f8fa;border-left:4px solid var(--acc);padding:10px 12px;border-radius:6px;font-size:14px;margin:6px 0;white-space:pre-wrap}
.hold{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.hold:last-child{border-bottom:none}
.hold input{transform:scale(1.3)}
.hold .nm{font-weight:600}
.hold .q{margin-left:auto;font-weight:800;font-size:16px;white-space:nowrap}
.cathd{font-size:13px;font-weight:800;color:var(--sub);margin:14px 0 2px;display:flex;gap:6px;align-items:center}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;justify-content:center;z-index:6;box-shadow:0 -4px 16px #0002}
.login{max-width:560px;margin:50px auto;padding:0 16px}
.login h1{font-size:28px;margin:0 0 6px}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;font-size:16px;font-weight:600;border-radius:10px;border:1px solid #dadce0}
.acct{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px}
.acct small{display:block;color:var(--sub)}
.center{text-align:center;padding:36px 22px}
.center .big{font-size:48px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (max-width:640px){.top .brand span{display:none}main{padding:14px 12px 90px}.card{padding:14px}.g2{grid-template-columns:1fr}.tabs{top:48px}.kpi .v{font-size:26px}}
</style>

<body>
<div id="app"><div class="empty" style="margin-top:30vh">불러오는 중…</div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
/* =========================================================
   설정 · 유틸
   ========================================================= */
const CFG = window.APP_CONFIG || {};
const MODE = CFG.firebase && CFG.firebase.apiKey ? 'firebase' : 'local';
const SUPER = String(MODE === 'local' ? 'super@demo.local' : (CFG.superAdminEmail || '')).toLowerCase();
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n, l = 2) => String(n).padStart(l, '0');
const now = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const day = s => (s || '').slice(0, 10);
const won = n => (Math.round(+n || 0)).toLocaleString('ko-KR') + '원';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));

const COLS = ['cats', 'items', 'units', 'comps', 'iss', 'reqs', 'users'];
const emptyS = () => Object.fromEntries(COLS.map(c => [c, []]));
let S = emptyS();
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(String(b.name));
const cats = () => [...S.cats].sort(byOrder);
const cat = id => S.cats.find(c => c.id === id);
const itemsOf = cid => S.items.filter(i => i.catId === cid).sort(byOrder);
const item = id => S.items.find(i => i.id === id);
const comp = id => S.comps.find(c => c.id === id);
const comps = () => [...S.comps].sort((a, b) => a.name.localeCompare(b.name));
const unit = id => S.units.find(u => u.id === id);
const user = id => S.users.find(u => u.id === id);
const out = l => l.qty - l.returned - l.lost;
const byDate = (a, b) => String(b.date || b.createdAt || '').localeCompare(String(a.date || a.createdAt || ''));
const NK = { '지급': 'G', '신고': 'R' };
function numbering(cnt, prefix, n = 1) {
  const y = new Date().getFullYear(), k = NK[prefix] + y, s = +(cnt?.[k] || 0);
  return { nos: Array.from({ length: n }, (_, i) => `${prefix}-${y}-${pad(s + i + 1, 3)}`), patch: { [k]: s + n } };
}

/* =========================================================
   데이터 계층 — Firebase(실서비스) / Local(체험 모드) 동일 인터페이스
   ========================================================= */
const strip = v => { const o = { ...v }; delete o.id; return o; };
const FB = {
  async init() {
    const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
    for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await loadScript(base + f);
    firebase.initializeApp(CFG.firebase);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    this.db.settings({ ignoreUndefinedProperties: true, merge: true });
    try { await this.db.enablePersistence({ synchronizeTabs: true }); } catch (e) { }
    this.auth.getRedirectResult().catch(e => toast('로그인 오류: ' + e.message));
  },
  onAuth(cb) { this.auth.onAuthStateChanged(u => cb(u ? { uid: u.uid, email: u.email, name: u.displayName, photo: u.photoURL } : null)); },
  async signIn() {
    const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
    try { await this.auth.signInWithPopup(p); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) await this.auth.signInWithRedirect(p);
      else if (e.code !== 'auth/popup-closed-by-user') throw e;
    }
  },
  signOut() { return this.auth.signOut(); },
  ref(c, i) { return this.db.collection(c).doc(i); },
  watch(col, f, cb, err) { let q = this.db.collection(col); if (f) q = q.where(f[0], '==', f[1]); return q.onSnapshot(s => cb(s.docs.map(d => ({ ...d.data(), id: d.id }))), err); },
  watchDoc(col, id, cb, err) { return this.ref(col, id).onSnapshot(d => cb(d.exists ? { ...d.data(), id: d.id } : null), err); },
  inc(n) { return firebase.firestore.FieldValue.increment(n); },
  newId() { return this.db.collection('_').doc().id; },
  tx(fn) {
    return this.db.runTransaction(async T => fn({
      get: async (c, i) => { const d = await T.get(this.ref(c, i)); return d.exists ? { ...d.data(), id: d.id } : null; },
      set: (c, i, v) => T.set(this.ref(c, i), strip(v)), update: (c, i, v) => T.update(this.ref(c, i), strip(v)), delete: (c, i) => T.delete(this.ref(c, i)),
    }));
  },
  async write(ops) {
    for (let k = 0; k < ops.length; k += 450) {
      const b = this.db.batch();
      ops.slice(k, k + 450).forEach(([o, c, i, v]) => o === 'set' ? b.set(this.ref(c, i), strip(v)) : o === 'update' ? b.update(this.ref(c, i), strip(v)) : b.delete(this.ref(c, i)));
      await b.commit();
    }
  },
};
const LOCAL = {
  KEY: 'safety-gear-demo-v2', subs: [],
  init() {
    this.load();
    addEventListener('storage', e => { if (e.key === this.KEY) { this.load(); this.emit(); } if (e.key === this.KEY + '-auth') this.authCb?.(this.curAuth()); });
  },
  load() { try { this.data = JSON.parse(LS.get(this.KEY)); } catch (e) { } if (!this.data) { this.data = demoSeed(); LS.set(this.KEY, JSON.stringify(this.data)); } },
  persist() { LS.set(this.KEY, JSON.stringify(this.data)); this.emit(); },
  emit() { this.subs.forEach(s => s()); },
  onAuth(cb) { this.authCb = cb; cb(this.curAuth()); },
  curAuth() { try { return JSON.parse(LS.get(this.KEY + '-auth')); } catch (e) { return null; } },
  async signIn(a) { LS.set(this.KEY + '-auth', JSON.stringify(a)); this.authCb(a); },
  async signOut() { LS.del(this.KEY + '-auth'); this.authCb(null); },
  watch(col, f, cb) { const s = () => cb(Object.values(this.data[col] || {}).filter(d => !f || d[f[0]] === f[1]).map(clone)); this.subs.push(s); setTimeout(s); return () => this.subs = this.subs.filter(x => x !== s); },
  watchDoc(col, id, cb) { const s = () => cb(clone(this.data[col]?.[id] || null)); this.subs.push(s); setTimeout(s); return () => this.subs = this.subs.filter(x => x !== s); },
  inc(n) { return { __inc: n }; },
  newId() { return uid(''); },
  apply(o, c, i, v) {
    const t = this.data[c] = this.data[c] || {};
    if (o === 'delete') { delete t[i]; return; }
    if (o === 'update' && !t[i]) throw new Error('문서를 찾을 수 없습니다');
    const n = o === 'set' ? {} : { ...t[i] };
    for (const [k, x] of Object.entries(v)) { if (k === 'id' || x === undefined) continue; n[k] = x && x.__inc !== undefined ? (+n[k] || 0) + x.__inc : clone(x); }
    n.id = i; t[i] = n;
  },
  async tx(fn) {
    const w = [], r = await fn({ get: async (c, i) => clone(this.data[c]?.[i] || null), set: (c, i, v) => w.push(['set', c, i, v]), update: (c, i, v) => w.push(['update', c, i, v]), delete: (c, i) => w.push(['delete', c, i]) });
    w.forEach(x => this.apply(...x)); this.persist(); return r;
  },
  async write(ops) { ops.forEach(x => this.apply(...x)); this.persist(); },
};
const DB = MODE === 'firebase' ? FB : LOCAL;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('불러오기 실패: ' + src)); document.head.appendChild(s); }); }

/* ---- 기본 장비 구성 (최초 1회 불러오기 / 체험 데이터) ---- */
function defaultCats() {
  return [
    [{ id: 'bc', order: 1, name: '바디캠', icon: '📹', tracking: 'unit', isSet: false, issueTypes: ['고장', '파손', '분실', '기타'], deductTypes: ['분실'],
       guide: '렌즈를 가리지 않도록 착용하고, 매일 작업 종료 후 충전해 주세요.\n고장·파손·분실 시 즉시 앱에서 신고해 주세요. 분실은 단가 기준으로 공제됩니다.' },
     [['bc1', '경량형', 180000, 0], ['bc2', '명찰형', 150000, 0]]],
    [{ id: 'ai', order: 2, name: 'AI 카메라', icon: '🎥', tracking: 'qty', isSet: true, issueTypes: ['고장', '파손', '분실', '기타'], deductTypes: ['분실'],
       guide: '구성품을 지급 시 함께 확인해 주세요. 반납 시 모든 구성품이 있어야 합니다.' },
     [['ai1', '카메라 본체', 1200000, 10], ['ai2', '배터리', 90000, 20], ['ai3', '거치대', 60000, 12], ['ai4', '충전기', 30000, 12], ['ai5', '메모리카드', 25000, 12]]],
    [{ id: 'lt', order: 3, name: '경광등·호출벨', icon: '🚨', tracking: 'qty', isSet: false, issueTypes: ['고장', '분실'], deductTypes: ['분실'], guide: '작업 종료 시 반납해 주세요.' },
     [['lt1', '경광등', 25000, 40], ['lt2', '호출벨', 15000, 40]]],
    [{ id: 'hs', order: 4, name: '혹서기 물품', icon: '🧊', tracking: 'qty', isSet: false, issueTypes: ['분실', '기타'], deductTypes: [], guide: '혹서기 종료 후 반납 대상 물품입니다.' },
     [['hs1', '아이스조끼', 35000, 50], ['hs2', '쿨토시', 3000, 200], ['hs3', '냉각타월', 5000, 100]]],
  ].map(([c, its]) => [c, its.map(([id, name, price, stock], k) => ({ id, catId: c.id, order: k + 1, name, price, stock }))]);
}
function demoSeed() {
  const d = Object.fromEntries([...COLS, 'meta'].map(c => [c, {}])), put = (c, o) => d[c][o.id] = o;
  defaultCats().forEach(([c, its]) => { put('cats', c); its.forEach(i => put('items', i)); });
  [['c1', '(주)한빛건설', '김현수', '010-1234-5678'], ['c2', '대성전기', '이도윤', '010-2345-6789'], ['c3', '미래안전산업', '박서준', '010-3456-7890']]
    .forEach(([id, name, manager, phone]) => put('comps', { id, name, manager, phone }));
  for (let i = 1; i <= 8; i++) put('units', { id: 'u' + i, catId: 'bc', itemId: i % 2 ? 'bc1' : 'bc2', serial: 'BC-' + pad(i, 4), status: '재고', companyId: null });
  const t = now();
  [['demo-super', '최종관리', 'super@demo.local', 'super', 'approved', 'admin', null],
   ['demo-admin', '안전팀 관리자', 'admin@demo.local', 'admin', 'approved', 'admin', null],
   ['demo-p1', '김현수', 'kim@hanbit.demo', 'partner', 'approved', 'partner', 'c1'],
   ['demo-p2', '이도윤', 'lee@daesung.demo', 'partner', 'approved', 'partner', 'c2'],
   ['demo-new1', '정하늘', 'jung@mirae.demo', 'none', 'pending', 'partner', 'c3'],
   ['demo-new2', '오지훈', 'oh@newco.demo', 'none', 'pending', 'partner', null, '(주)새솔건설'],
   ['demo-new3', '한지민', 'han@office.demo', 'none', 'pending', 'admin', null]]
    .forEach(([id, name, email, role, status, requestedRole, companyId, requestedCompany]) => put('users',
      { id, name, email, role, status, requestedRole, companyId, requestedCompany: requestedCompany || '', phone: '', createdAt: t, approvedBy: status === 'approved' ? '시스템' : '', approvedAt: status === 'approved' ? t : '' }));
  const mk = (id, no, companyId, status, notes, lines) => {
    put('iss', { id, no, companyId, date: t, notes, status, returns: [], createdBy: '안전팀 관리자', signer: status === 'signed' ? '이도윤' : '', signedAt: status === 'signed' ? t : '', sig: '',
      lines: lines.map(([itemId, qty, unitId], k) => { const it = d.items[itemId], u = unitId && d.units[unitId];
        if (u) Object.assign(u, { status: '지급', companyId }); else it.stock -= qty;
        return { lid: id + 'l' + k, catId: it.catId, itemId, itemName: it.name, unitId: unitId || null, serial: u ? u.serial : null, qty, returned: 0, lost: 0 }; }) });
  };
  const y = new Date().getFullYear();
  mk('g1', `지급-${y}-001`, 'c1', 'pending', '3공구 야간작업조 지급분', [['bc1', 1, 'u1'], ['bc2', 1, 'u2'], ['lt1', 2], ['lt2', 2], ['hs1', 5]]);
  mk('g2', `지급-${y}-002`, 'c2', 'signed', '', [['ai1', 1], ['ai2', 1], ['ai3', 1], ['ai4', 1], ['ai5', 1], ['bc1', 1, 'u3']]);
  put('reqs', { id: 'r1', no: `신고-${y}-001`, companyId: 'c2', issId: 'g2', lid: 'g2l1', catId: 'ai', itemId: 'ai2', itemName: '배터리', unitId: null, serial: null,
    type: '분실', qty: 1, desc: '현장 이동 중 분실 추정', date: t, status: '접수', by: '이도윤' });
  d.meta.counters = { id: 'counters', ['G' + y]: 2, ['R' + y]: 1 };
  return d;
}

async function boot() {
  try { await DB.init(); } catch (e) { $('#app').innerHTML = `<div class="login"><div class="card center"><div class="big">⚠️</div><h2>연결할 수 없습니다</h2><p class="muted">${esc(e.message)}<br>인터넷 연결을 확인하고 새로고침해 주세요.</p></div></div>`; return; }
  DB.onAuth(a => {
    AUTH = a; meUnsub?.(); meUnsub = null; stopData(); ME = a ? undefined : null; dataKey = '';
    render();
    if (!a) return;
    meUnsub = DB.watchDoc('users', a.uid, async d => {
      if (!d && String(a.email).toLowerCase() === SUPER) {   // 최종 관리자 최초 로그인 → 자동 등록
        try { await DB.write([['set', 'users', a.uid, { email: a.email, name: a.name || '최종 관리자', photo: a.photo || '', phone: '', role: 'super', status: 'approved', requestedRole: 'admin', companyId: null, createdAt: now(), approvedBy: '시스템', approvedAt: now() }]]); } catch (e) { onErr(e); }
        return;
      }
      ME = d;
      const k = d ? `${d.status}|${d.role}|${d.companyId}` : 'none';
      if (k !== dataKey) { dataKey = k; startData(); }
      schedule();
    }, onErr);
  });
}

}

}
function itemStats(c, it) {

  const stock = c.tracking === 'unit' ? S.units.filter(u => u.itemId === it.id && u.status === '재고').length : +it.stock || 0;
  return { stock, out: o, lost };
}

async function loadDefaults() {
  const ops = [];
  defaultCats().forEach(([c, its]) => { ops.push(['set', 'cats', c.id, c]); its.forEach(i => ops.push(['set', 'items', i.id, i])); });
  try { await DB.write(ops); toast('기본 장비 구성을 불러왔습니다'); } catch (e) { onErr(e); }
}

/* ---- 지급·반납 ---- */
function lineName(l, withCat) {
  const c = cat(l.catId), name = item(l.itemId)?.name || l.itemName || '(삭제된 품목)', serial = l.serial || unit(l.unitId)?.serial;
  return `${withCat && c ? c.icon + ' ' : ''}${esc(name)}${serial ? ` <span class="muted">${esc(serial)}</span>` : ''}`;
}
const lineText = l => (item(l.itemId)?.name || l.itemName || '') + (l.serial ? ` (${l.serial})` : '');
function summary(lines) {
  const m = {};
  lines.forEach(l => { const n = item(l.itemId)?.name || l.itemName; m[n] = (m[n] || 0) + l.qty; });
  return Object.entries(m).map(([n, q]) => `${esc(n)}×${q}`).join(', ');
}
function isState(is) {
  if (is.status === 'pending') return ['서명대기', 't-wait'];
  return is.lines.some(l => out(l) > 0) ? ['지급중', 't-ok'] : ['반납·종결', 't-gray'];
}

function addSet(cid) { $$(`input[data-q][data-cat="${cid}"]`).forEach(i => i.value = (+i.value || 0) + 1); }
async function submitIssue(btn) {
  const companyId = $('#ic').value; if (!companyId) return toast('받는 협력사를 선택하세요');
  const lines = [];
  $$('input[data-unit]:checked').forEach(i => lines.push({ catId: i.dataset.cat, itemId: i.dataset.item, unitId: i.dataset.unit, qty: 1 }));
  $$('input[data-q]').forEach(i => { const q = Math.floor(+i.value || 0); if (q > 0) lines.push({ catId: i.dataset.cat, itemId: i.dataset.item, unitId: null, qty: q }); });
  if (!lines.length) return toast('지급할 장비를 선택하세요');
  const notes = $('#inote').value.trim();
  btn.disabled = true;
  try {
    const no = await DB.tx(async t => {
      const cnt = await t.get('meta', 'counters') || {}, its = {}, us = {};
      for (const l of lines) { if (l.unitId) us[l.unitId] = await t.get('units', l.unitId); else if (!its[l.itemId]) its[l.itemId] = await t.get('items', l.itemId); }
      const need = {}; lines.forEach(l => { if (!l.unitId) need[l.itemId] = (need[l.itemId] || 0) + l.qty; });
      for (const [id, q] of Object.entries(need)) if ((its[id]?.stock || 0) < q) throw new Error(`${its[id]?.name} 재고(${its[id]?.stock || 0})가 부족합니다`);
      for (const [id, u] of Object.entries(us)) if (!u || u.status !== '재고') throw new Error(`${u?.serial || id}은(는) 이미 지급되었거나 사용할 수 없습니다`);
      const { nos, patch } = numbering(cnt, '지급');
      t.set('meta', 'counters', { ...cnt, ...patch });
      t.set('iss', DB.newId(), { no: nos[0], companyId, date: now(), notes, status: 'pending', returns: [], createdBy: ME.name,
        lines: lines.map(l => ({ lid: uid('l'), catId: l.catId, itemId: l.itemId, itemName: item(l.itemId)?.name || '', unitId: l.unitId, serial: l.unitId ? us[l.unitId].serial : null, qty: l.qty, returned: 0, lost: 0 })) });
      Object.entries(need).forEach(([id, q]) => t.update('items', id, { stock: DB.inc(-q) }));
      Object.keys(us).forEach(id => t.update('units', id, { status: '지급', companyId }));
      return nos[0];
    });
    $$('#issueForm [data-keep]').forEach(el => el.type === 'checkbox' ? el.checked = false : el.value = '');
    render(); toast(`${no} 등록 — ${comp(companyId)?.name}의 서명을 기다립니다`);
  } catch (e) { onErr(e); btn.disabled = false; }
}
async function cancelIssuance(id) {
  const is0 = S.iss.find(x => x.id === id);
  if (!is0 || !confirm(`${is0.no} 지급을 취소할까요? 재고가 복원됩니다.`)) return;
  try {
    await DB.tx(async t => {
      const is = await t.get('iss', id);
      if (!is || is.status !== 'pending') throw new Error('이미 서명되었거나 없는 지급 건입니다');
      is.lines.forEach(l => l.unitId ? t.update('units', l.unitId, { status: '재고', companyId: null }) : t.update('items', l.itemId, { stock: DB.inc(l.qty) }));
      t.delete('iss', id);
    });
    toast('지급이 취소되었습니다');
  } catch (e) { onErr(e); }
}
function issLines(is) {
  return `<div class="tw"><table><tr><th>장비</th><th class="r">지급</th><th class="r">반납</th><th class="r">분실</th><th class="r">보유중</th></tr>
    ${is.lines.map(l => `<tr><td>${lineName(l, 1)}</td><td class="r">${l.qty}</td><td class="r">${l.returned || ''}</td><td class="r">${l.lost || ''}</td><td class="r"><b>${out(l)}</b></td></tr>`).join('')}</table></div>`;

function guides(is) {

    <label class="f">수령 서명</label>${is.status === 'signed' ? `<div>${esc(is.signer)} · ${is.signedAt}</div>${is.sig ? `<img src="${is.sig}" style="max-width:260px;border:1px solid var(--line);border-radius:8px;margin-top:6px">` : ''}` : '<div class="muted">협력사 서명 대기 중</div>'}
    <div class="foot"><button onclick="closeModal()">닫기</button></div>`);

function returnModal(id) {
  const is = S.iss.find(x => x.id === id);
  openModal(`<h2>반납 처리</h2><div class="muted">${is.no} · ${esc(comp(is.companyId)?.name)}</div>
    <div class="tw" style="margin-top:12px"><table><tr><th>장비</th><th class="r">보유중</th><th class="r">반납</th></tr>
    ${is.lines.filter(l => out(l) > 0).map(l => `<tr><td>${lineName(l, 1)}</td><td class="r">${out(l)}</td><td class="r">
      ${l.unitId ? `<input type="checkbox" data-ret="${l.lid}">` : `<input class="num" type="number" min="0" max="${out(l)}" placeholder="0" data-ret="${l.lid}">`}</td></tr>`).join('')}</table></div>
    <div class="foot"><button onclick="$$('[data-ret]').forEach(i=>i.type==='checkbox'?i.checked=true:i.value=i.max)">전체 반납</button><span class="sp"></span>
      <button onclick="closeModal()">취소</button><button class="pri" onclick="doReturn('${id}')">반납 확인</button></div>`);
}
async function doReturn(id) {
  const want = {};
  $$('[data-ret]').forEach(i => { const n = i.type === 'checkbox' ? (i.checked ? 1 : 0) : Math.floor(+i.value || 0); if (n > 0) want[i.dataset.ret] = n; });
  if (!Object.keys(want).length) return toast('반납할 수량을 입력하세요');
  try {
    await DB.tx(async t => {
      const is = await t.get('iss', id), done = [];
      is.lines.forEach(l => {
        const n = Math.min(want[l.lid] || 0, out(l)); if (!n) return;
        l.returned += n; done.push(`${lineText(l)}×${n}`);
        l.unitId ? t.update('units', l.unitId, { status: '재고', companyId: null }) : t.update('items', l.itemId, { stock: DB.inc(n) });
      });
      t.update('iss', id, { lines: is.lines, returns: [...(is.returns || []), { date: now(), text: done.join(', '), by: ME.name }] });
    });
    closeModal(); toast('반납 처리되었습니다');
  } catch (e) { onErr(e); }
}

  const list = S.reqs.filter(r => match(r) && (!view.reqCat || r.catId === view.reqCat) && (!view.reqComp || r.companyId === view.reqComp)).sort(byDate);

      <span class="r"><select style="width:auto" onchange="view.reqComp=this.value;render()"><option value="">전체 협력사</option>${comps().map(c => `<option value="${c.id}" ${view.reqComp === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>

      ${list.map(r => `<tr>${isNew ? `<td><input type="checkbox" data-sel ${sel.has(r.id) ? 'checked' : ''} onchange="this.checked?sel.add('${r.id}'):sel.delete('${r.id}')"></td>` : ''}

        <td style="max-width:260px">${esc(r.desc)}${r.adminNote ? `<div class="muted">↳ ${esc(r.adminNote)}</div>` : ''}</td><td>${reqTag(r.status)}</td>
        <td class="r">${r.deduct ? (isDd ? `<input class="num" style="width:110px" type="number" value="${r.amount || 0}" onchange="setAmount('${r.id}',this.value)">` : won(r.amount)) : '-'}</td>

async function setAmount(id, v) { try { await DB.write([['update', 'reqs', id, { amount: +v || 0 }]]); } catch (e) { onErr(e); } }
async function bulkConfirm(ids) {
  if (!ids.length) return toast('확인할 신고를 선택하세요');
  try {
    const [n, d] = await DB.tx(async t => {
      const rs = [], isd = {};
      for (const id of ids) { const r = await t.get('reqs', id); if (r && r.status === '접수') rs.push(r); }
      for (const r of rs) if (r.type === '분실' && !(r.issId in isd)) isd[r.issId] = await t.get('iss', r.issId);
      let d = 0;
      for (const r of rs) {
        const c = cat(r.catId); let q = r.qty;
        if (r.type === '분실') {
          const l = isd[r.issId]?.lines.find(x => x.lid === r.lid);
          if (l) { q = Math.min(q, out(l)); l.lost += q; if (l.unitId) t.update('units', l.unitId, { status: '분실' }); }
        }
        const deduct = !!c?.deductTypes?.includes(r.type); if (deduct) d++;

      }
      Object.values(isd).forEach(is => is && t.update('iss', is.id, { lines: is.lines }));
      return [rs.length, d];
    });
    sel = new Set(); render(); toast(`${n}건 확인 완료${d ? ` · 공제 대상 ${d}건 취합됨` : ''}`);
  } catch (e) { onErr(e); }
}

  }
  if (role !== 'partner') p.companyId = null;
  if (role === 'super' && !confirm(`${u.name} 님을 최종 관리자로 지정할까요? 관리자 승인 권한을 갖게 됩니다.`)) { el.value = u.role; return; }
  await changeUser(id, p);
}

/* ---- 엑셀 내보내기 ---- */
function rowsStock(c) {
  if (c.tracking === 'unit') return S.units.filter(u => u.catId === c.id).map(u => ({ '장비': c.name, '품목': item(u.itemId)?.name, '시리얼': u.serial, '상태': u.status, '보유/분실 협력사': comp(u.companyId)?.name || '' }));
  return itemsOf(c.id).map(it => { const s = itemStats(c, it); return { '장비': c.name, '품목': it.name, '단가': it.price || 0, '창고 재고': s.stock, '지급중': s.out, '분실 누계': s.lost }; });
}
function rowsIssue(c) {
  const r = [];
  [...S.iss].sort(byDate).forEach(is => is.lines.forEach(l => { if (c && l.catId !== c.id) return;
    r.push({ '지급번호': is.no, '지급일시': is.date, '협력사': comp(is.companyId)?.name, '장비': cat(l.catId)?.name, '품목': item(l.itemId)?.name || l.itemName, '시리얼': l.serial || '',
      '지급': l.qty, '반납': l.returned, '분실': l.lost, '보유중': out(l), '서명': is.status === 'signed' ? '완료' : '대기', '서명자': is.signer || '', '서명일시': is.signedAt || '',
      '반납기록': (is.returns || []).map(x => `${x.date} ${x.text}`).join(' / '), '안내사항': is.notes || '', '등록자': is.createdBy || '' }); }));
  return r;
}
function rowsHold(c) {
  const r = [];
  comps().forEach(co => holdings(co.id).forEach(h => { if (c && h.l.catId !== c.id) return;
    r.push({ '협력사': co.name, '장비': cat(h.l.catId)?.name, '품목': item(h.l.itemId)?.name || h.l.itemName, '시리얼': h.l.serial || '', '보유 수량': h.n, '지급번호': h.is.no, '지급일': day(h.is.date) }); }));
  return r;
}
const reqRow = r => ({ '신고번호': r.no, '접수일시': r.date, '협력사': comp(r.companyId)?.name, '신고자': r.by || '', '장비': cat(r.catId)?.name, '품목': item(r.itemId)?.name || r.itemName,
  '시리얼': r.serial || '', '유형': r.type, '수량': r.qty, '내용': r.desc, '상태': r.status, '처리일시': r.doneAt || '', '처리자': r.doneBy || '', '공제 대상': r.deduct ? 'Y' : '',
  '공제 금액': r.deduct ? r.amount : '', '관리자 메모': r.adminNote || '' });
const rowsReq = c => [...S.reqs].sort(byDate).filter(r => !c || r.catId === c.id).map(reqRow);
const rowsDeduct = c => deductList().filter(r => !c || r.catId === c.id).sort(byDate).map(r => ({ '협력사': comp(r.companyId)?.name, '장비': cat(r.catId)?.name, '품목': item(r.itemId)?.name || r.itemName,
  '시리얼': r.serial || '', '수량': r.qty, '단가': item(r.itemId)?.price || 0, '공제 금액': r.amount, '신고일': day(r.date), '확인일': day(r.doneAt), '사유': r.desc, '신고번호': r.no }));
function xlsx(fname, sheets) {
  const stamp = now().slice(0, 10).replace(/-/g, '');
  if (!window.XLSX) {
    const [, rows] = Object.entries(sheets)[0], keys = Object.keys(rows[0] || { '데이터 없음': '' });
    const csv = [keys, ...rows.map(r => keys.map(k => r[k]))].map(a => a.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = `${fname}_${stamp}.csv`; a.click();
    return toast('엑셀 라이브러리를 불러오지 못해 CSV로 저장했습니다');
  }
  const wb = XLSX.utils.book_new();
  Object.entries(sheets).forEach(([n, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '내용': '데이터 없음' }]), keys = Object.keys(rows[0] || { '내용': 1 });
    ws['!cols'] = keys.map(k => ({ wch: Math.min(50, Math.max(k.length * 2 + 2, ...rows.slice(0, 300).map(r => String(r[k] ?? '').length * 1.6 + 2))) }));
    XLSX.utils.book_append_sheet(wb, ws, n.slice(0, 31));
  });
  XLSX.writeFile(wb, `${fname}_${stamp}.xlsx`); toast('엑셀 파일을 저장했습니다');
}
function exportCat(id) { const c = cat(id); xlsx(c.name, { '재고현황': rowsStock(c), '보유현황': rowsHold(c), '지급내역': rowsIssue(c), '특이사항': rowsReq(c), '공제대상': rowsDeduct(c) }); }
function exportDeduct() { xlsx('공제대상', { '공제대상': rowsDeduct() }); }
function exportAll() {
  xlsx('안전장구_전체', { '재고현황': cats().flatMap(rowsStock), '보유현황': rowsHold(), '지급내역': rowsIssue(), '특이사항': rowsReq(), '공제대상': rowsDeduct(),
    '사용자': S.users.map(u => ({ '이름': u.name, '이메일': u.email, '연락처': u.phone || '', '권한': ROLE[u.role] || u.role, '소속': comp(u.companyId)?.name || '', '상태': u.status, '승인자': u.approvedBy || '', '승인일': u.approvedAt || '' })) });
}
function exportTab() {
  return `<div class="grid kpis" style="margin-bottom:16px">${cats().map(c => { const s = catStats(c); return `<div class="card kpi" onclick="exportCat('${c.id}')">
      <div class="l">${c.icon} ${esc(c.name)}</div><div style="font-size:14px;margin:8px 0">재고 ${s.stock} · 지급중 ${s.out} · 신고 ${S.reqs.filter(r => r.catId === c.id).length}</div><div class="h">⬇ 엑셀 다운로드</div></div>`; }).join('')}
    <div class="card kpi" style="border-color:var(--ink)" onclick="exportAll()"><div class="l">📚 전체 통합</div><div style="font-size:14px;margin:8px 0">모든 장비 + 공제대상 + 사용자</div><div class="h">⬇ 엑셀 다운로드</div></div></div>
  <div class="card"><h3>ℹ️ 파일 구성</h3><div class="muted">장비별 파일은 <b>재고현황 · 보유현황(협력사별) · 지급내역(서명·반납 포함) · 특이사항 · 공제대상</b> 시트로 구성됩니다.</div></div>
  <div class="card"><h3>💾 데이터 백업</h3><div class="row"><button onclick="backup()">현재 데이터 백업 저장(JSON)</button><span class="muted">서명 이미지를 포함한 전체 데이터를 파일로 보관합니다.</span></div></div>`;
}
function backup() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `안전장구_백업_${now().slice(0, 10)}.json`; a.click(); }

/* =========================================================
   협력사 사용자
   ========================================================= */
function partnerView() {
  const c = comp(ME.companyId) || { name: '' }, pend = S.iss.filter(i => i.status === 'pending').sort(byDate);
  const hs = holdings(ME.companyId), my = [...S.reqs].sort(byDate);
  const openReq = l => S.reqs.find(r => r.lid === l.lid && r.status === '접수');
  const byCat = {}; hs.forEach(h => (byCat[h.l.catId] = byCat[h.l.catId] || []).push(h));
  return topBar() + `<main class="narrow">
    ${pend.length ? `<div class="notice"><h3>✍️ 서명이 필요한 지급 건 ${pend.length}건</h3><div class="muted" style="color:#9a3d06">장비와 안내사항을 확인하고 서명하면 ‘내 보유 장비’에 등록됩니다.</div>
      ${pend.map(is => `<div class="pend"><div><b>${is.no}</b> <span class="muted">${day(is.date)}</span><div style="font-size:14px">${summary(is.lines)}</div></div><span class="sp"></span>
        <button class="pri" onclick="signModal('${is.id}')">확인하고 서명</button></div>`).join('')}</div>` : ''}
    <div class="card"><h3>🦺 ${esc(c.name)} 보유 장비 <span class="muted" style="font-weight:400">${hs.reduce((a, h) => a + h.n, 0)}개</span></h3>
      ${hs.length ? `<div class="muted">문제가 생긴 장비를 체크한 뒤 아래 <b>문제 신고하기</b>를 누르세요. 여러 개를 한 번에 신고할 수 있습니다.</div>
        ${Object.entries(byCat).map(([cid, arr]) => `<div class="cathd">${cat(cid)?.icon || ''} ${esc(cat(cid)?.name || '')}</div>
          ${arr.map(h => { const k = h.is.id + '|' + h.l.lid, o = openReq(h.l); return `<label class="hold"><input type="checkbox" ${sel.has(k) ? 'checked' : ''} onchange="this.checked?sel.add('${k}'):sel.delete('${k}');updBar()">
            <div><div class="nm">${lineName(h.l)}</div><div class="muted">${h.is.no} · ${day(h.is.date)} 지급 ${o ? '· ' + tag(o.type + ' 신고 접수중', 't-wait') : ''}</div></div><div class="q">${h.n}개</div></label>`; }).join('')}`).join('')}`
      : '<div class="empty">보유 중인 장비가 없습니다</div>'}</div>
    <div class="card"><h3>📨 신고 내역</h3>${my.length ? `<div class="tw"><table>${my.map(r => `<tr><td class="muted">${day(r.date)}</td><td>${lineName(r, 1)}<div class="muted">${esc(r.by || '')}</div></td><td>${typeTag(r.type)} ×${r.qty}</td>
      <td class="r">${reqTag(r.status)}${r.adminNote ? `<div class="muted">${esc(r.adminNote)}</div>` : ''}${r.deduct ? `<div class="muted">공제 ${won(r.amount)}</div>` : ''}</td></tr>`).join('')}</table></div>` : '<div class="empty">신고 내역이 없습니다</div>'}</div>
    <div class="card"><h3>🧾 지급·반납 이력</h3>${[...S.iss].sort(byDate).map(is => { const [s, cl] = isState(is);
      return `<div class="hold" onclick="issDetail('${is.id}')"><div><div class="nm">${is.no} ${tag(s, cl)}</div><div class="muted">${day(is.date)} · ${summary(is.lines)}${is.returns?.length ? ` · 반납 ${is.returns.length}회` : ''}</div></div><div class="q muted">›</div></div>`; }).join('') || '<div class="empty">이력이 없습니다</div>'}</div>
  </main><div class="bar hidden" id="bar"><span id="barN"></span><button class="pri" onclick="reportModal()">문제 신고하기</button><button class="sm" style="background:transparent;color:#fff;border-color:#fff5" onclick="sel=new Set();render()">선택 해제</button></div>`;
}
function updBar() { const b = $('#bar'); if (!b) return; b.classList.toggle('hidden', !sel.size); $('#barN').textContent = `${sel.size}개 장비 선택됨`; }
function reportModal() {
  const items = [...sel].map(k => { const [iid, lid] = k.split('|'), is = S.iss.find(x => x.id === iid), l = is?.lines.find(x => x.lid === lid); return l && out(l) > 0 ? { is, l } : null; }).filter(Boolean);
  if (!items.length) return;
  const allT = [...new Set(items.flatMap(x => cat(x.l.catId)?.issueTypes || []))];
  openModal(`<h2>문제 신고</h2><div class="muted">유형을 고르고 상황을 적어 주세요. 관리자에게 바로 전달됩니다.</div>
    <label class="f">한 번에 지정</label><div class="chips">${allT.map(t => `<button class="sm" onclick="$$('.rt input[value=&quot;${esc(t)}&quot;]').forEach(i=>i.checked=true)">모두 ${esc(t)}</button>`).join('')}</div>
    ${items.map((x, i) => { const c = cat(x.l.catId) || { icon: '', issueTypes: ['고장', '분실', '기타'] }; return `<div class="rt" style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px">
      <div class="row"><b>${c.icon} ${lineName(x.l)}</b><span class="sp"></span>${out(x.l) === 1 ? '<span class="muted">1개</span>' : `<span class="muted">수량</span><input class="num" type="number" min="1" max="${out(x.l)}" value="${out(x.l)}" data-rq>`}</div>
      <div class="chips" style="margin-top:8px">${c.issueTypes.map(t => `<label class="chip"><input type="radio" name="rt${i}" value="${esc(t)}">${esc(t)}</label>`).join('')}</div></div>`; }).join('')}
    <label class="f">상황 설명</label><textarea id="rdesc" placeholder="예: 10/20 오후 3공구 작업 중 낙하로 렌즈 파손"></textarea>
    <div class="foot"><button onclick="closeModal()">취소</button><button class="pri" onclick='submitReport(this,${JSON.stringify(items.map(x => [x.is.id, x.l.lid]))})'>신고 접수</button></div>`);
}
async function submitReport(btn, keys) {
  const blocks = $$('.rt'), desc = $('#rdesc').value.trim();
  if (blocks.some(b => !b.querySelector('input[type=radio]:checked'))) return toast('모든 장비의 신고 유형을 선택하세요');
  const entries = blocks.map((b, i) => {
    const [issId, lid] = keys[i], l = S.iss.find(x => x.id === issId).lines.find(x => x.lid === lid), q = b.querySelector('[data-rq]');
    return { companyId: ME.companyId, issId, lid, catId: l.catId, itemId: l.itemId, itemName: l.itemName || item(l.itemId)?.name || '', unitId: l.unitId, serial: l.serial || null,
      type: b.querySelector('input[type=radio]:checked').value, qty: q ? Math.max(1, Math.min(out(l), Math.floor(+q.value || 1))) : 1, desc, status: '접수', by: ME.name, byUid: AUTH.uid };
  });
  btn.disabled = true;
  try {
    await DB.tx(async t => {
      const cnt = await t.get('meta', 'counters') || {}, { nos, patch } = numbering(cnt, '신고', entries.length);
      t.set('meta', 'counters', { ...cnt, ...patch });
      entries.forEach((e, i) => t.set('reqs', DB.newId(), { ...e, no: nos[i], date: now() }));
    });
    sel = new Set(); closeModal(); render(); toast(`${entries.length}건 신고가 접수되었습니다`);
  } catch (e) { onErr(e); btn.disabled = false; }
}
function signModal(id) {
  const is = S.iss.find(x => x.id === id);
  openModal(`<h2>지급 확인 및 서명</h2><div class="muted">${is.no} · ${day(is.date)} · ${esc(comp(is.companyId)?.name)}</div>
    <label class="f">① 지급 장비</label><div class="tw"><table><tr><th>장비</th><th class="r">수량</th></tr>${is.lines.map(l => `<tr><td>${lineName(l, 1)}</td><td class="r">${l.qty}</td></tr>`).join('')}</table></div>
    <label class="f">② 안내사항</label>${guides(is) || '<div class="muted">없음</div>'}
    <label class="f" style="color:var(--ink)"><input type="checkbox" id="sg_ok" onchange="chkSign()"> 위 장비를 정상 수령했으며, 안내사항(분실 시 공제 포함)을 확인했습니다.</label>
    <label class="f">③ 수령자 성명</label><input id="sg_name" value="${esc(ME.name)}" oninput="chkSign()">
    <label class="f">④ 서명 <button class="sm ghost" onclick="clearSig()">지우기</button></label><canvas class="sig" id="sg"></canvas>
    <div class="foot"><button onclick="closeModal()">나중에</button><button class="pri" id="sg_btn" disabled onclick="doSign('${id}')">서명 완료</button></div>`);
  setupSig($('#sg'));
}
function setupSig(cv) {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  const x = cv.getContext('2d'); x.scale(dpr, dpr); x.lineWidth = 2.6; x.lineCap = x.lineJoin = 'round'; x.strokeStyle = '#111';
  let on = false; cv.dataset.drawn = '';
  cv.onpointerdown = e => { on = true; cv.setPointerCapture(e.pointerId); x.beginPath(); x.moveTo(e.offsetX, e.offsetY); };
  cv.onpointermove = e => { if (!on) return; x.lineTo(e.offsetX, e.offsetY); x.stroke(); if (!cv.dataset.drawn) { cv.dataset.drawn = '1'; chkSign(); } };
  cv.onpointerup = cv.onpointercancel = () => on = false;
}
function clearSig() { const cv = $('#sg'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); cv.dataset.drawn = ''; chkSign(); }
function chkSign() { $('#sg_btn').disabled = !($('#sg_ok').checked && $('#sg_name').value.trim() && $('#sg').dataset.drawn); }
async function doSign(id) {
  const cv = $('#sg'), t = document.createElement('canvas');
  t.width = 400; t.height = Math.round(400 * cv.height / cv.width); t.getContext('2d').drawImage(cv, 0, 0, t.width, t.height);
  $('#sg_btn').disabled = true;
  try {
    await DB.write([['update', 'iss', id, { status: 'signed', signer: $('#sg_name').value.trim(), signedAt: now(), sig: t.toDataURL('image/png'), signedBy: AUTH.uid }]]);
    closeModal(); toast('서명 완료 — 보유 장비에 등록되었습니다');
  } catch (e) { onErr(e); chkSign(); }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
boot();
